name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 词典库不进 git：CI 里现做（ECDICT CSV + scripts/build_dict.py，约 1 分钟）
      - name: Cache ECDICT source
        uses: actions/cache@v4
        with:
          path: /tmp/ecdict.csv
          key: ecdict-csv-1.0.28

      - name: Build dictionary database
        run: |
          if [ ! -f /tmp/ecdict.csv ]; then
            curl -sSL --retry 3 -o /tmp/ecdict.csv \
              https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
          fi
          # 输出为 .png：GH Pages CDN 对图片类型不 gzip，前端按 Range 原始字节懒取
          python3 scripts/build_dict.py /tmp/ecdict.csv docs/public/dict/dict.png

      - name: Build with VitePress
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
