# quizCraft 静态站点 Nginx 配置
# 部署到服务器的 /etc/nginx/conf.d/quizcraft.conf
# 假设域名：quizcraft.example.com （请替换为你自己的域名）

server {
    listen 80;
    server_name quizcraft.example.com;  # TODO: 改成你的域名

    # 根目录指向 portal 子站点
    root /var/www/quizcraft/portal;
    index index.html;

    # SPA / 静态站点的 history fallback：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子站点：嵌入式电路
    location /embedded-circuit/ {
        alias /var/www/quizcraft/2026-08-embedded-circuit/;
        try_files $uri $uri/ /embedded-circuit/index.html;
    }

    # 子站点：英语语法
    location /english-grammar/ {
        alias /var/www/quizcraft/2026-08-english-grammar/;
        try_files $uri $uri/ /english-grammar/index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
